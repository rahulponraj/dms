<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DMS · Delivery Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"></head><body>
<section id="login"><div class="login-card"><div class="brand"><span class="mark"></span>DMS</div>
<h1>Every invoice, from dock to dealer.</h1><p class="muted">Sign in to track deliveries and proof of delivery.</p>
<input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password">
<button class="btn primary" id="loginBtn">Sign in</button><p id="loginErr" class="err"></p></div></section>
<div id="app" hidden><aside><div class="brand"><span class="mark"></span>DMS</div><nav id="nav"></nav><div class="who"><span id="who"></span><button class="link" id="logout">Sign out</button></div></aside>
<main><header><h2 id="title"></h2><div id="actions"></div></header><div id="view"></div></main></div>
<div id="drawer" class="drawer" hidden><div class="drawer-in"><button class="link close" onclick="closeDrawer()">Close</button><div id="drawerBody"></div></div></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="config.js"></script><script src="app.js"></script></body></html>
